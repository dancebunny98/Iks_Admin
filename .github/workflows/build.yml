name: Build modules

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'IksAdmin/**'
      - 'IksAdminApi/**'
      - 'RequirmentsApi/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  # ---------------------------------------------------------------
  # 0) Guard: fail fast if anyone commits a build/ output folder.
  #    dotnet build output is a generated artifact, not source - if it
  #    gets committed, people who download the repo can end up deploying
  #    stale DLLs instead of what's actually in the source (this bit us
  #    in the VIPCore repo, so it's checked here from day one).
  # ---------------------------------------------------------------
  no-tracked-build-output:
    name: Guard against committed build/ output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for tracked build/ directories
        run: |
          tracked=$(git ls-files | grep -E '(^|/)build/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Found build/ output files committed to git - these are generated by 'dotnet build' and must be gitignored, not tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No committed build/ output directories found."

  # ---------------------------------------------------------------
  # 1) Every module under modules/, built and packaged INDIVIDUALLY.
  #    One module failing does NOT stop the others.
  #    Add new modules to this list as you add folders under modules/.
  # ---------------------------------------------------------------
  build-modules:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    strategy:
      fail-fast: false
      matrix:
        module:
          - IksAdmin_OnlineAdmins
    steps:
      - uses: actions/checkout@v5

      - name: Sanity check - IksAdminApi present
        run: |
          PROJ="IksAdminApi/IksAdminApi.csproj"
          if [ ! -f "$PROJ" ]; then
            echo "::error::$PROJ not found at repo root. Expected layout: /IksAdmin, /IksAdminApi, /RequirmentsApi, /modules"
            echo "--- repo root listing ---"
            ls -la
            exit 1
          fi
          echo "Found $PROJ ✔"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        id: build
        continue-on-error: true
        run: |
          set -e
          PROJ="modules/${{ matrix.module }}/${{ matrix.module }}.csproj"
          if [ ! -f "$PROJ" ]; then
            echo "::warning::$PROJ not found, skipping"
            exit 0
          fi
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c ${{ env.CONFIGURATION }} --no-restore

      - name: Collect output
        if: steps.build.outcome == 'success'
        run: |
          set -e
          MOD="${{ matrix.module }}"
          PROJDIR="modules/$MOD"
          OUT="out/addons/counterstrikesharp/plugins/$MOD"
          mkdir -p "$OUT"

          DLL=$(find "$PROJDIR" -path '*/obj/*' -prune -o -name "$MOD.dll" -print | head -n1)

          if [ -z "$DLL" ]; then
            echo "::warning::could not locate $MOD.dll after a successful build"
            exit 0
          fi

          BIN=$(dirname "$DLL")
          find "$BIN" -maxdepth 1 -name "*.dll" -exec cp {} "$OUT"/ \;
          find "$BIN" -maxdepth 1 -name "*.pdb" -exec cp {} "$OUT"/ \;

          # Per-module translations, if the module ships its own lang/ folder
          if [ -d "$PROJDIR/lang" ]; then
            mkdir -p "$OUT/lang"
            cp "$PROJDIR"/lang/*.json "$OUT/lang"/ 2>/dev/null || true
          fi

          find out -type f

      - name: Report failure
        if: steps.build.outcome == 'failure'
        run: echo "::warning::${{ matrix.module }} failed to build - see the 'Restore & build' step log above"

      - uses: actions/upload-artifact@v6
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.module }}-${{ github.sha }}
          path: out/
          if-no-files-found: warn
