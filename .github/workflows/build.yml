name: Build modules

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'IksAdmin/**'
      - 'IksAdminApi/**'
      - 'RequirmentsApi/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # DLL-контракты, которые ДОЛЖНЫ приходить только из shared/<Имя>/ на сервере -
  # никогда не должны лежать копией внутри папки конкретного плагина/модуля, иначе
  # это два разных CLR-типа в разных AssemblyLoadContext, и capability-вызовы между
  # плагинами (ядро IksAdmin <-> модули, любой модуль <-> VIPCore) ломаются.
  # Используется шагом "Strip shared-contract DLLs" ниже как доп. страховка поверх
  # Private=false в .csproj (тот флаг не всегда транзитивно наследуется).
  SHARED_DLLS: "VipCoreApi.dll MenuManagerApi.dll IksAdminApi.dll CS2ScreenMenuAPI.dll LevelsRanksApi.dll FakeRanksApi.dll AnyBaseLib.dll PlayerSettingsApi.dll"

jobs:
  no-tracked-build-output:
    name: Guard against committed build/ output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for tracked build/ directories
        run: |
          tracked=$(git ls-files | grep -E '(^|/)build/' | grep -viE '/readme\.md$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Found build/ output files committed to git - these are generated by 'dotnet build' and must be gitignored, not tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No committed build/ output files found (README.md inside build/ is allowed)."

  build-core:
    name: Build IksAdmin + IksAdminApi
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build core projects
        id: core_build
        continue-on-error: true
        run: |
          set -e
          # Собираем сначала IksAdminApi отдельно - её вывод идёт ТОЛЬКО в shared/
          # (см. Collect ниже). IksAdmin.csproj её тоже соберёт транзитивно при
          # своей сборке (нужно для компиляции), но Private=false в самом
          # IksAdmin.csproj не даст этой копии попасть в его bin/.
          dotnet restore IksAdminApi/IksAdminApi.csproj
          dotnet build IksAdminApi/IksAdminApi.csproj -c ${{ env.CONFIGURATION }} --no-restore
          dotnet restore IksAdmin/IksAdmin.csproj
          dotnet build IksAdmin/IksAdmin.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Collect core output
        if: steps.core_build.outcome == 'success'
        run: |
          set -e

          # IksAdmin.csproj's ExportPluginFiles target уже разложил всё по местам:
          # bundle/plugins/IksAdmin (ядро + приватные зависимости + lang/configs/sortmenus)
          # и bundle/shared/IksAdminApi (если Private=false почему-то не сработал).
          BUNDLE="IksAdmin/bin/${{ env.CONFIGURATION }}/net8.0/bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "::error::$BUNDLE not found - ExportPluginFiles target didn't run or failed"
            exit 1
          fi

          mkdir -p out/addons/counterstrikesharp
          cp -r "$BUNDLE"/plugins out/addons/counterstrikesharp/
          cp -r "$BUNDLE"/configs out/addons/counterstrikesharp/ 2>/dev/null || true

          # shared/IksAdminApi - берём из ОТДЕЛЬНОЙ сборки IksAdminApi.csproj выше
          # (Private=false в IksAdmin.csproj обычно значит, что в его собственном
          # bundle/shared/ ничего не окажется - это ожидаемо, не ошибка).
          mkdir -p out/addons/counterstrikesharp/shared/IksAdminApi
          BIN_API="IksAdminApi/bin/${{ env.CONFIGURATION }}/net8.0"
          cp "$BIN_API/IksAdminApi.dll" out/addons/counterstrikesharp/shared/IksAdminApi/
          [ -f "$BIN_API/IksAdminApi.pdb" ] && cp "$BIN_API/IksAdminApi.pdb" out/addons/counterstrikesharp/shared/IksAdminApi/ || true

          # Страховка: убираем shared-контракты из папки плагина, если они всё же
          # туда просочились (см. SHARED_DLLS выше).
          for dep in $SHARED_DLLS; do
            f="out/addons/counterstrikesharp/plugins/IksAdmin/$dep"
            pdb="out/addons/counterstrikesharp/plugins/IksAdmin/${dep%.dll}.pdb"
            [ -f "$f" ] && { echo "Removing bundled $dep from plugins/IksAdmin - must come from shared/ instead"; rm -f "$f"; }
            [ -f "$pdb" ] && rm -f "$pdb"
          done

          echo "Core artefacts collected:"
          find out -type f

      - name: Report core failure
        if: steps.core_build.outcome == 'failure'
        run: echo "::warning::IksAdmin or IksAdminApi failed to build - see step log above"

      - uses: actions/upload-artifact@v6
        if: steps.core_build.outcome == 'success'
        with:
          name: IksAdminCore-${{ github.sha }}
          path: out/
          if-no-files-found: error

  build-modules:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    strategy:
      fail-fast: false
      matrix:
        module:
          - IksAdmin_OnlineAdmins
          - IksAdmin_VipGive
          - IksAdmin_Maps
          - IksAdmin_CustomMenus
    steps:
      - uses: actions/checkout@v5

      - name: Sanity check - required local projects present
        run: |
          MISSING=0
          for PROJ in "IksAdminApi/IksAdminApi.csproj" "RequirmentsApi/MenuManagerApi.dll" "RequirmentsApi/VipCoreApi.dll"; do
            if [ ! -f "$PROJ" ]; then
              echo "::error::$PROJ not found at repo root."
              MISSING=1
            else
              echo "Found $PROJ ✔"
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "Expected layout: /IksAdmin, /IksAdminApi, /RequirmentsApi (incl. MenuManagerApi.dll + VipCoreApi.dll), /modules"
            echo "--- repo root listing ---"
            ls -la
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        id: build
        continue-on-error: true
        run: |
          set -e
          PROJ="modules/${{ matrix.module }}/${{ matrix.module }}.csproj"
          if [ ! -f "$PROJ" ]; then
            echo "::warning::$PROJ not found, skipping"
            exit 0
          fi
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c ${{ env.CONFIGURATION }} --no-restore

      - name: Collect output
        if: steps.build.outcome == 'success'
        run: |
          set -e
          MOD="${{ matrix.module }}"
          PROJDIR="modules/$MOD"
          OUT="out/addons/counterstrikesharp/plugins/$MOD"
          mkdir -p "$OUT"

          DLL=$(find "$PROJDIR" -path '*/obj/*' -prune -o -name "$MOD.dll" -print | head -n1)
          if [ -z "$DLL" ]; then
            echo "::warning::could not locate $MOD.dll after a successful build"
            exit 0
          fi

          BIN=$(dirname "$DLL")
          find "$BIN" -maxdepth 1 -name "*.dll" -exec cp {} "$OUT"/ \;
          find "$BIN" -maxdepth 1 -name "*.pdb" -exec cp {} "$OUT"/ \;

          for dep in $SHARED_DLLS; do
            f="$OUT/$dep"
            [ -f "$f" ] && { echo "Removing bundled $dep - must come from shared/ instead"; rm -f "$f"; }
          done

          if [ -d "$PROJDIR/lang" ]; then
            mkdir -p "$OUT/lang"
            cp "$PROJDIR"/lang/*.json "$OUT/lang"/ 2>/dev/null || true
          fi

          find out -type f

      - name: Report failure
        if: steps.build.outcome == 'failure'
        run: echo "::warning::${{ matrix.module }} failed to build - see the 'Restore & build' step log above"

      - uses: actions/upload-artifact@v6
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.module }}-${{ github.sha }}
          path: out/
          if-no-files-found: warn
